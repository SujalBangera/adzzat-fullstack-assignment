
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ task.title }} - Adzzat Labs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <a href="/" class="back-link">← Back to Tasks</a>

        <h1>{{ task.title }}</h1>

        <div class="task-detail">
            <p><strong>Task Type:</strong> {{ task.type }}</p>
            <p><strong>Difficulty:</strong> {{ task.difficulty }}</p>
            <p><strong>Environment:</strong> {{ task.environment }}</p>

            <h2>Difficulty Note</h2>
            <p>{{ task.difficulty_note }}</p>

            <h2>Task Statement</h2>
            <pre>{{ task.statement }}</pre>
        </div>
    </div>

</body>
</html>
